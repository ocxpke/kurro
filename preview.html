<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kurro · Temas</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #e9eeef; color: #22383c; }
    header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 20px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    header b { margin-right: 8px; }
    header button { border: 1px solid #c9d6d8; background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; }
    header button.on { background: #22383c; color: #fff; border-color: #22383c; }
    .sep { width: 1px; height: 24px; background: #c9d6d8; margin: 0 6px; }
    main { display: flex; flex-wrap: wrap; gap: 28px; padding: 24px 20px; justify-content: center; }
    figure { margin: 0; }
    figcaption { font-weight: 700; margin-bottom: 8px; }
    figcaption small { font-weight: 400; color: #566c70; }
    iframe { width: 390px; height: 760px; border: 0; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.15); background: #fff; }
    figure[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <b>kurro · Temas</b>
    <span data-group="theme"></span>
    <span class="sep"></span>
    <span data-group="mode"></span>
  </header>
  <main id="grid"></main>
  <script>
    var THEMES = { algodon: 'Algodón (oficial)', petroleo: 'Petróleo', salvia: 'Salvia', crema: 'Crema' };
    var MODES = { all: 'Claro y oscuro', light: 'Claro', dark: 'Oscuro' };
    var filter = { theme: 'all', mode: 'all' };
    var grid = document.getElementById('grid');

    Object.keys(THEMES).forEach(function (t) {
      ['light', 'dark'].forEach(function (m) {
        var f = document.createElement('figure');
        f.dataset.theme = t; f.dataset.mode = m;
        f.innerHTML = '<figcaption>' + THEMES[t] + ' <small>' + (m === 'light' ? 'claro' : 'oscuro') + '</small></figcaption>' +
          '<iframe src="index.html?theme=' + t + '&mode=' + m + '"></iframe>';
        grid.appendChild(f);
      });
    });

    function buttons(group, items) {
      var el = document.querySelector('[data-group="' + group + '"]');
      Object.keys(items).forEach(function (k) {
        var b = document.createElement('button');
        b.textContent = items[k]; b.dataset.k = k;
        b.onclick = function () { filter[group] = k; apply(); };
        el.appendChild(b);
      });
    }
    buttons('theme', Object.assign({ all: 'Todos' }, THEMES));
    buttons('mode', MODES);

    function apply() {
      document.querySelectorAll('header button').forEach(function (b) {
        var g = b.parentNode.dataset.group; b.classList.toggle('on', filter[g] === b.dataset.k);
      });
      document.querySelectorAll('figure').forEach(function (f) {
        f.hidden = !((filter.theme === 'all' || f.dataset.theme === filter.theme) &&
                     (filter.mode === 'all' || f.dataset.mode === filter.mode));
      });
    }
    apply();
  </script>
</body>
</html>
